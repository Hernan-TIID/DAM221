<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Módulo Cocina - Catálogo de Productos</title>
</head>
<body>

  <h1>Módulo de Cocina: Catálogo</h1>

  <!-- FORMULARIO DE CATÁLOGO -->
  <h2>Gestión de Producto</h2>
  <form id="form-producto">
    <input type="hidden" id="producto-id">

    <div>
      <label for="nombre">Nombre del producto:</label>
      <input type="text" id="nombre" required>
    </div>
    <br>
    <div>
      <label for="precio">Precio ($):</label>
      <input type="number" id="precio" step="0.5" required>
    </div>
    <br>
    <!-- El botón de submit debe ser el único encargado de enviar -->
<button type="submit" id="btn-guardar">Agregar Producto</button>

<!-- OBLIGATORIO: type="button" evita que este botón recargue la página -->
<button type="button" id="btn-cancelar" style="display: none;">Cancelar Edición</button>
  </form>

  <hr>

  <!-- TABLA DE CATÁLOGO -->
  <h2>Productos Disponibles</h2>
  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-body">
      <!-- Se llena dinámicamente desde JS -->
    </tbody>
  </table>

  <script src="ModuloCocina.js"></script>
</body>
</html>
